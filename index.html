<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Ícone circular, gerado a partir da marca oficial (veja README).

      Uma família só, de disco azul-marinho. Chegou a existir uma variante de
      disco branco atrás de `media="(prefers-color-scheme: dark)"`, mas o Chrome
      só respeita `media` em <link rel="icon"> com SVG — na prática, quem usa o
      navegador no tema escuro continuava recebendo o disco navy. Em vez de
      manter uma promessa que o navegador não cumpre, o enquadramento foi feito
      para se sustentar nas duas barras: no fundo claro vale o contorno do
      disco, no fundo escuro vale o escudo branco dentro dele.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B2341" />

    <title>QA's Guardiões do Software — Comunidade de Qualidade de Software</title>
    <meta
      name="description"
      content="Comunidade brasileira, gratuita e aberta de profissionais e estudantes de Qualidade de Software. Dúvidas, vagas, automação e um playground para praticar testes manuais e automatizados."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QA's Guardiões do Software" />
    <meta property="og:description" content="Qualidade de software com clareza, proteção e confiança. Comunidade gratuita de QA no WhatsApp e no Discord." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Aplica o tema salvo ANTES da primeira pintura. Sem isto, quem escolheu o
      // tema claro veria um piscar escuro a cada carregamento (o React só ajusta
      // o <html> depois de montar). Sem preferência salva, o padrão é o escuro —
      // é a aplicação principal da marca (versão negativa sobre o azul-marinho).
      (function () {
        try {
          var t = localStorage.getItem("qag_theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
